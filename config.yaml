#General SETTINGS
data_directory: DATA_SET #DataSet Directory
test_set_path: "TEST_SET"
classes: [JumpingJack, Lunges,PullUps,PushUps] #Classes names in Dataset
no_classes: 4 #Number of classes in dataset
test_size: 0.2 #Size of testset
threshold: 0.4 #Threshold for kepoints and boundingBoxes
model_directory: models/movenet_multipose_lightning_1 #Pose estimation model directory
sequence_length: 30 # number of frames in each video
no_sequences: 30 # number of videos in each class
epochs: 2000 #number of epochs to train on
batch_size: 64 #Batch size for training
optimizer: adam #Adam , RMSprops .. etc
loss: categorical_crossentropy #binary_crossentropy, categorical_crossentropy...
log_path: "logs" # where to save logs after training
saved_weights_path: "models/weights.h5"
frame_distance: 4 #distance between frames that we want to take

#LSTM model configuration
# Architecture Selection (LSTM or CNN_1D)
architecture: CNN1D

# Model Configuration
model:
  # CNN 1D Configuration
  - layer: Conv1D
    filters: 64
    kernel_size: 3
    activation: relu
  - layer: MaxPooling1D
    pool_size: 2
  - layer: Flatten
  - layer: Dense
    units: 32
    activation: relu
  - layer: Dropout
    drop_perc: 0.5
  - layer: Dense
    units: 4
    activation: softmax
