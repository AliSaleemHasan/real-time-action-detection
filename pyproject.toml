[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "utils"]

[project]
name = "real-time-action-detection"
version = "0.1.0"
description = "Real-time action detection using pose estimation"
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.23.0,<2.0.0",
    "opencv-python>=4.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.0.0",
    "tensorflow>=2.10.0,<2.11.0",
    "tensorflow-hub>=0.12.0",
    "ultralytics>=8.0.0",
]
